services:
  postgres:
    image: postgres:16-alpine
    container_name: protocol_time_machine_db
    environment:
      POSTGRES_DB: protocol_time_machine
      POSTGRES_USER: ptm_user
      POSTGRES_PASSWORD: ptm_password
    ports:
      - "5432:5432"
    volumes:
      - ptm_pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptm_user -d protocol_time_machine"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: protocol_time_machine_server
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://ptm_user:ptm_password@postgres:5432/protocol_time_machine?sslmode=disable"
      ENV: "development"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ptm_pgdata:
